databases:
  - name: rentmgnt-db
    plan: free
    databaseName: rentmgnt
    user: rentmgnt

services:
  - type: web
    name: rentmgnt-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentmgnt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
